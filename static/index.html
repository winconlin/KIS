<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIS — Krankenhaus-Informations-System</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --border: #334155;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
        header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 1rem 2rem; background: var(--surface);
            border-bottom: 1px solid var(--border); margin-bottom: 2rem;
        }
        h1 { font-size: 1.5rem; font-weight: 600; }
        h1 span { color: var(--accent); }
        .status { display: flex; gap: 1rem; align-items: center; }
        .status-badge {
            padding: 0.25rem 0.75rem; border-radius: 999px;
            font-size: 0.8rem; font-weight: 500;
        }
        .status-badge.ok { background: rgba(34,197,94,0.15); color: var(--success); }
        .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
        .card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 12px; padding: 1.5rem; transition: border-color 0.2s;
        }
        .card:hover { border-color: var(--accent); }
        .card h3 { font-size: 1rem; margin-bottom: 0.5rem; color: var(--text-muted); }
        .card .value { font-size: 2rem; font-weight: 700; }
        .card .sub { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem; }
    </style>
</head>
<body>
    <header>
        <h1>KIS <span>Krankenhaus-Informations-System</span></h1>
        <div class="status">
            <span class="status-badge ok">● Online</span>
            <span style="color: var(--text-muted); font-size: 0.85rem;">v0.1.0</span>
        </div>
    </header>
    <div class="container">
        <div class="cards">
            <div class="card">
                <h3>Patienten</h3>
                <div class="value">0</div>
                <div class="sub">Gesamt</div>
            </div>
            <div class="card">
                <h3>Termine heute</h3>
                <div class="value">0</div>
                <div class="sub">Geplant</div>
            </div>
            <div class="card">
                <h3>Ärzte</h3>
                <div class="value">0</div>
                <div class="sub">Im System</div>
            </div>
            <div class="card">
                <h3>Schnittstellen</h3>
                <div class="value">3</div>
                <div class="sub">HL7 · FHIR · DICOM</div>
            </div>
        </div>
    </div>
</body>
</html>
