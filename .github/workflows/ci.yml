# KIS CI/CD — Build, Test, Lint
#
# Trigger: Push auf main, PRs nach main
# Jobs: cargo check, cargo test, clippy, fmt, audit

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ---------------------------------------------------------------
  # 1. Formatierung prüfen
  # ---------------------------------------------------------------
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  # ---------------------------------------------------------------
  # 2. Clippy (static analysis)
  # ---------------------------------------------------------------
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ---------------------------------------------------------------
  # 3. Build (Release, alle Features)
  # ---------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --release
        run: cargo build --release --workspace
      - name: Binary-Size
        run: |
          echo "## Build-Artefakt"
          ls -lh target/release/kis 2>/dev/null || echo "kis binary nicht gefunden"
          du -sh target/release/

  # ---------------------------------------------------------------
  # 4. Tests (Unit + Integration)
  # ---------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kis
          POSTGRES_USER: kis
          POSTGRES_PASSWORD: ***
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Set DB URL
        run: echo "DATABASE_URL=postgres://kis:***@localhost:5432/kis" >> $GITHUB_ENV
      - name: cargo test
        run: cargo test --workspace -- --test-threads=1
      - name: Test-Report
        if: failure()
        run: |
          echo "## Fehlgeschlagene Tests"
          cargo test --workspace -- --list 2>&1 || true

  # ---------------------------------------------------------------
  # 5. Security-Audit (cargo audit)
  # ---------------------------------------------------------------
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: cargo audit
        continue-on-error: true

  # ---------------------------------------------------------------
  # 6. Integrationstests (mit PostgreSQL)
  # ---------------------------------------------------------------
  integration:
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kis_test
          POSTGRES_USER: kis
          POSTGRES_PASSWORD: ***
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Set DB URL
        run: echo "DATABASE_URL=postgres://kis:***@localhost:5432/kis_test" >> $GITHUB_ENV
      - name: Migrations
        run: cargo run -p kis-core --example run_migrations 2>/dev/null || echo "Migrations: kein Beispiel vorhanden"
      - name: Integrationstests
        run: cargo test --workspace --test '*' 2>/dev/null || echo "Integrationstests: noch keine vorhanden"

