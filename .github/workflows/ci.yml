# KIS CI — Format, Lint, Tests (inkl. echter PostgreSQL-Integration),
# SQL-Schema-Abgleich, Leitplanken, Modulgrenzen, Dependency-Audit,
# Dokumentation, Container-Build. Lokal dasselbe mit scripts/check.sh.
#
# Keine Prüfung ist mit continue-on-error oder "|| echo" abgeschwächt.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      KIS_TEST_DATABASE_URL: postgres://postgres:ci-only-password@localhost:5432/postgres
      # Fehlende Datenbank darf nicht als bestanden gelten
      KIS_REQUIRE_PG_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (Unit + PostgreSQL-Integration)
        run: cargo test --locked --workspace
      - name: cargo build --bins
        run: cargo build --locked --bins
      - name: Backup-/Restore-Tests (pg_dump + age)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q age postgresql-client
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Least-Privilege-Rollen, Migration und SQL-Schema-Abgleich
        env:
          PGPASSWORD: ci-only-password
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -v owner_pw="'ci-owner'" -v app_pw="'ci-app'" -f config/postgres/roles.sql
          export KIS_DATABASE__MIGRATION_URL=postgres://kis_owner:ci-owner@localhost:5432/kis
          ./target/debug/kis-admin migrate
          # alle Crates; neue Module werden ohne weitere Pflege mitgeprüft
          python3 scripts/check_sql.py \
            --database-url postgres://kis_app:ci-app@localhost:5432/kis

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      # Begründete Ausnahmen stehen in .cargo/audit.toml
      - run: cargo audit

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dokumentations-Check
        run: python3 scripts/check_docs.py
      - name: Leitplanken (Migrationen unverändert, kein unfertiger Code)
        run: python3 scripts/check_guardrails.py
      - name: Modulgrenzen (Tabellen-Eigentum, Abhängigkeiten)
        run: python3 scripts/check_modules.py

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose-Konfiguration prüfen
        env:
          POSTGRES_PASSWORD: x
          KIS_OWNER_PASSWORD: x
          KIS_APP_PASSWORD: x
          KIS_JWT_SECRET: x
          KIS_MASTER_KEY: x
        run: docker compose config -q
      - name: Image bauen
        run: docker build -t kis:ci .
      - name: Container-Smoke-Test (mit PostgreSQL)
        run: python3 scripts/check_container.py --image kis:ci
