[package]
name = "kis-app"
version = "0.2.0"
edition = "2021"
description = "KIS: Server `kis` und Werkzeug `kis-admin`; setzt Kern und Module zusammen"
license = "MIT"

[[bin]]
name = "kis"
path = "src/main.rs"

[[bin]]
name = "kis-admin"
path = "src/bin/kis-admin.rs"

[lib]
name = "kis_app"
path = "src/lib.rs"

[dependencies]
kis-core = { workspace = true }

# Module — ein Eintrag je Modul, registriert in src/modules.rs
kis-org = { path = "../kis-org" }
kis-patients = { path = "../kis-patients" }
kis-cases = { path = "../kis-cases" }
kis-clinical = { path = "../kis-clinical" }
kis-orders = { path = "../kis-orders" }
kis-lab = { path = "../kis-lab" }
kis-nursing = { path = "../kis-nursing" }
kis-prescriptions = { path = "../kis-prescriptions" }
kis-meals = { path = "../kis-meals" }
kis-roster = { path = "../kis-roster" }
kis-doctors = { path = "../kis-doctors" }
kis-appointments = { path = "../kis-appointments" }
kis-medications = { path = "../kis-medications" }
kis-ui = { path = "../kis-ui" }
# NEUE-MODULE: scripts/new_module.py trägt oberhalb dieser Zeile ein

tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }
rustls = { workspace = true }
axum-server = { workspace = true }

[dev-dependencies]
tower = { workspace = true }
http-body-util = "0.1"

[lints]
workspace = true
