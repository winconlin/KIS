[package]
name = "kis-xds"
version = "0.1.0"
edition = "2021"
description = "KIS XDS-b Repository & Registry — DocumentRegistry/DocumentEntry/Query, Storage /data/xds, Audit-Log"
license = "MIT"

[lib]
name = "kis_xds"
path = "src/lib.rs"

