# KIS — Konfiguration der Installation (Infrastruktur)
#
# Alle Werte sind optional; ohne Datei gelten sparsame Standardwerte.
# Umgebungsvariablen überschreiben die Datei: KIS_<ABSCHNITT>__<SCHLÜSSEL>,
# z. B. KIS_DATABASE__WRITE_URL. Secrets stehen nie in dieser Datei.
#
# Richtlinien des Hauses (Zeitlimits, Behandlungszusammenhang, Rollen und
# Rechte) werden zur Laufzeit in der Anwendung gepflegt, nicht hier.

[server]
host = "127.0.0.1"
port = 8080
shutdown_timeout_seconds = 30
request_timeout_seconds = 30
max_body_bytes = 1048576

[database]
# Laufzeitrolle (nur DML). Passwort über KIS_DATABASE__WRITE_URL setzen.
write_url = "postgres://kis_app@localhost:5432/kis"
# Schema-Eigentümer, nur für Migrationen (leer = über write_url migrieren)
migration_url = ""
# Lese-Replica für Auswertungen (leer = keine)
read_url = ""
# Verbindungen je Instanz: kleines Haus 5–10, mittleres 20–40,
# Maximalversorger 50–100 je Instanz bei mehreren Instanzen
pool_size = 10
# Dauerhaft offene Verbindungen (0 = Aufbau nur bei Bedarf)
min_connections = 0
acquire_timeout_seconds = 10
idle_timeout_seconds = 300

[security]
# Namen der Umgebungsvariablen mit den Schlüsseln
jwt_secret_env = "KIS_JWT_SECRET"
token_expiry = 900
refresh_expiry = 86400
# Startwerte; zur Laufzeit über die Einstellungen änderbar
max_login_attempts = 5
lockout_duration = 900

[security.rate_limit]
requests_per_minute = 600
auth_requests_per_minute = 10

[security.encryption]
master_key_env = "KIS_MASTER_KEY"

[logging]
level = "info"
format = "json"

[modules]
# Fachmodule abschalten, z. B. ["roster", "meals"]. Kennungen und Status:
# GET /api/v1/modules. Kernmodule lassen sich nicht abschalten.
disabled = []
# Experimentelle Module ausdrücklich einschalten
experimental = []
