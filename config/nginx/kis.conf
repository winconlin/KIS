# KIS — Nginx Load-Balancer Konfiguration
#
# Verteilt Requests auf mehrere KIS-Instanzen (stateless).
# TLS 1.3 terminiert am Load-Balancer, intern HTTP.
#
# Deployment: /etc/nginx/sites-available/kis.conf
# Symlink: /etc/nginx/sites-enabled/kis.conf
# Test: nginx -t && systemctl reload nginx

# --- Upstream: KIS-Instanzen ---
# Jede Instanz ist stateless (JWT-Auth, kein Session-State).
# Horizontale Skalierung: einfach weitere Instanzen hinzufügen.
upstream kis_backend {
    least_conn;
    server 127.0.0.1:8080 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8081 max_fails=3 fail_timeout=30s;
    # server 127.0.0.1:8082 max_fails=3 fail_timeout=30s;
    keepalive 64;
}

# --- TLS-Zertifikate ---
# Let's Encrypt oder eigene CA
ssl_certificate     /etc/letsencrypt/live/kis.example.com/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/kis.example.com/privkey.pem;

# --- TLS 1.3 only (DSGVO: Transportverschlüsselung) ---
ssl_protocols TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:KISSession:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# --- Security-Header (OWASP) ---
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'" always;

# --- Rate-Limiting (100 req/min pro IP) ---
limit_req_zone $binary_remote_addr zone=kis_limit:10m rate=100r/m;
limit_req_status 429;

# --- Auth-Rate-Limiting (10 req/min pro IP) ---
limit_req_zone $binary_remote_addr zone=kis_auth:10m rate=10r/m;

# --- Server ---
server {
    listen 443 ssl http2;
    server_name kis.example.com;

    # Client-Body-Size: 50 MB (DICOM-Uploads, Dokumente)
    client_max_body_size 50m;

    # Proxy-Timeouts (TI, MEDICO können langsam sein)
    proxy_connect_timeout 30s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # --- API + GUI ---
    location / {
        limit_req zone=kis_limit burst=20 nodelay;

        proxy_pass http://kis_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;

        # WebSocket (Dashboard-Auto-Refresh)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- Auth-Endpoints (strenge Rate-Limiting) ---
    location ~ ^/api/v1/(auth|login|register) {
        limit_req zone=kis_auth burst=5 nodelay;

        proxy_pass http://kis_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- HL7 MLLP (TCP, kein HTTP) ---
    # Wird separat gehandhabt, nicht über Nginx-HTTP.
    # Direkte TCP-Weiterleitung:
    #   stream { server { listen 6667; proxy_pass 127.0.0.1:6667; } }

    # --- DICOM (TCP Port 104) ---
    # Ebenfalls direkte TCP-Weiterleitung, kein Nginx-HTTP.

    # --- Health-Check (ohne Rate-Limit) ---
    location /health {
        proxy_pass http://kis_backend;
        access_log off;
    }

    # --- GDT-Downloads (große Dateien) ---
    location ~ ^/api/v1/export/gdt/download/ {
        proxy_pass http://kis_backend;
        proxy_buffering off;
        proxy_set_header X-Accel-Buffering no;
    }
}

# --- HTTP → HTTPS Redirect ---
server {
    listen 80;
    server_name kis.example.com;
    return 301 https://$host$request_uri;
}

