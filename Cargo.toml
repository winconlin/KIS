# ============================================================
# KIS — Krankenhaus-Informations-System (VOLLSTÄNDIGER ERSATZ für CGM MEDICO)
# Cargo-Workspace mit 13 Crates unter crates/
# ============================================================

[workspace]
resolver = "2"
members = [
    "crates/kis-app",
    "crates/kis-core",
    "crates/kis-patients",
    "crates/kis-doctors",
    "crates/kis-appointments",
    "crates/kis-medications",
    "crates/kis-hl7",
    "crates/kis-fhir",
    "crates/kis-dicom",
    "crates/kis-xds",
    "crates/kis-gdt",
    "crates/kis-medico",
    "crates/kis-ti",
    "crates/kis-ui",
]

# Zentrale Versionsverwaltung: alle Member-Crates vererben mit `workspace = true`
[workspace.dependencies]
# Web-Framework
axum = { version = "0.7", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }

# Datenbank: PostgreSQL (sqlx), Migrations, JSONB, UUID, Chrono
sqlx = { version = "0.7", features = [
    "runtime-tokio",
    "postgres",
    "migrate",
    "macros",
    "chrono",
    "uuid",
    "json",
] }

# Zeit & Identität
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Konfiguration (TOML + ENV)
figment = { version = "0.10", features = ["toml", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Fehlerhandling
thiserror = "1"
anyhow = "1"

# Sicherheit: JWT, Argon2id, AES-256-GCM, Krypto-Primitives, TOTP
jsonwebtoken = "9"
argon2 = "0.5"
aes-gcm = "0.10"
ring = "0.17"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
totp-rs = "5"

# HTTP-Client (rustls, kein OpenSSL) — für FHIR/ISiK/Medico-Integration
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }

# Interne KIS-Crates (Pfad-Abhängigkeiten)
kis-core = { path = "crates/kis-core" }
kis-patients = { path = "crates/kis-patients" }
kis-doctors = { path = "crates/kis-doctors" }
kis-appointments = { path = "crates/kis-appointments" }
kis-medications = { path = "crates/kis-medications" }
kis-hl7 = { path = "crates/kis-hl7" }
kis-fhir = { path = "crates/kis-fhir" }
kis-dicom = { path = "crates/kis-dicom" }
kis-xds = { path = "crates/kis-xds" }
kis-gdt = { path = "crates/kis-gdt" }
kis-medico = { path = "crates/kis-medico" }
kis-ti = { path = "crates/kis-ti" }
kis-ui = { path = "crates/kis-ui" }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
