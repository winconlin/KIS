# ============================================================
# KIS — Krankenhaus-Informations-System
# Cargo-Workspace: Kern (kis-core), Anwendung (kis-app) und je Fachmodul
# eine eigene Crate unter crates/. Aufbau: docs/ARCHITECTURE.md
# ============================================================

[workspace]
resolver = "2"
# Jedes Fachmodul ist eine eigene Crate. Neues Modul: hier eintragen und in
# crates/kis-app/src/modules.rs registrieren (siehe docs/MODULE.md).
members = [
    "crates/kis-app",
    "crates/kis-core",
    # Kernmodule
    "crates/kis-org",
    "crates/kis-patients",
    "crates/kis-cases",
    # Fachmodule
    "crates/kis-clinical",
    "crates/kis-orders",
    "crates/kis-lab",
    "crates/kis-nursing",
    "crates/kis-prescriptions",
    "crates/kis-meals",
    "crates/kis-roster",
    "crates/kis-doctors",
    "crates/kis-appointments",
    "crates/kis-medications",
    "crates/kis-ui",
    # NEUE-MODULE: scripts/new_module.py trägt oberhalb dieser Zeile ein
]
# Ältere Schnittstellen-Entwürfe: nicht Teil des Builds (entwurf/README.md)
exclude = ["entwurf"]

[workspace.dependencies]
# Web-Framework
axum = { version = "0.7", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["trace", "catch-panic", "timeout"] }

# Datenbank: PostgreSQL (sqlx), Migrations, JSONB, UUID, Chrono
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "migrate",
    "macros",
    "chrono",
    "uuid",
    "json",
] }

# Zeit & Identität
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Konfiguration (TOML + ENV)
figment = { version = "0.10", features = ["toml", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Fehlerhandling
thiserror = "1"
anyhow = "1"

# Sicherheit: JWT, Argon2id, AES-256-GCM, Krypto-Primitives, TOTP
jsonwebtoken = "9"
argon2 = "0.5"
aes-gcm = "0.10"
ring = "0.17"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
totp-rs = "5"

# TLS 1.3: rustls mit ring-Backend
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }


# Interne KIS-Crates
kis-core = { path = "crates/kis-core" }

# Gemeinsame Lint-Konfiguration (jede Crate: `[lints] workspace = true`).
[workspace.lints.clippy]
# Axum-Handler geben idiomatisch `Result<_, Response>` zurück. `Response`
# ist größer als die Clippy-Schwelle (128 Bytes); ab Clippy 1.99 schlägt das
# in jedem Handler an. Boxen brächte hier keinen Nutzen (Fehlerpfad, einmal
# pro Request). Bewusste, begründete Ausnahme — keine anderen Lints.
result_large_err = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
