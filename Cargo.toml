[package]
name = "kis"
default-run = "kis"
version = "0.1.0"
edition = "2021"
description = "KIS — Krankenhaus-Informations-System"
license = "MIT"

[dependencies]
# Web/GUI
axum = { version = "0.7", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }

# Datenbank (SQLite)
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "migrate", "chrono", "uuid", "json"] }

# Medizinschnittstellen
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Konfiguration
figment = { version = "0.10", features = ["toml", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Fehlerhandling
thiserror = "1"
anyhow = "1"

# Sicherheit
jsonwebtoken = "9"
argon2 = "0.5"
aes-gcm = "0.10"
ring = "0.17"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
totp-rs = "5"

# HTTP (rustls, kein OpenSSL)
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
