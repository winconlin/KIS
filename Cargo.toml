[package]
name = "kis"
version = "0.1.0"
edition = "2021"
description = "KIS — Krankenhaus-Informations-System"
license = "MIT"

[dependencies]
# Web/GUI
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs"] }

# Datenbank
sqlx = { version = "0.7", features = ["runtime-tokio-rusqlite", "sqlite", "migrate"] }
rusqlite = { version = "0.31", features = ["bundled"] }

# Medizinschnittstellen
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Konfiguration
figment = { version = "0.10", features = ["toml", "env", "yaml"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Fehlerhandling
thiserror = "1"
anyhow = "1"

# OpenAI-kompatible API (für LLM-Integration)
reqwest = { version = "0.12", features = ["json", "stream"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
