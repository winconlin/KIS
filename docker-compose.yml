# Entwicklungs-/Testumgebung: PostgreSQL 16 + KIS.
# Secrets in .env (siehe .env.example), nie im Repository.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
      KIS_OWNER_PASSWORD: ${KIS_OWNER_PASSWORD:?KIS_OWNER_PASSWORD in .env setzen}
      KIS_APP_PASSWORD: ${KIS_APP_PASSWORD:?KIS_APP_PASSWORD in .env setzen}
    volumes:
      - kis_pg:/var/lib/postgresql/data
      - ./config/postgres/roles.sql:/kis/roles.sql:ro
      - ./config/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-kis-roles.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "kis"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  kis:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      KIS_SERVER__PORT: "8080"
      KIS_DATABASE__WRITE_URL: postgres://kis_app:${KIS_APP_PASSWORD}@db:5432/kis
      KIS_DATABASE__MIGRATION_URL: postgres://kis_owner:${KIS_OWNER_PASSWORD}@db:5432/kis
      KIS_DATABASE__POOL_SIZE: "20"
      KIS_JWT_SECRET: ${KIS_JWT_SECRET:?KIS_JWT_SECRET in .env setzen}
      KIS_MASTER_KEY: ${KIS_MASTER_KEY:?KIS_MASTER_KEY in .env setzen}
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  kis_pg:
