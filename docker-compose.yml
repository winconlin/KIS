services:
  kis:
    build: .
    environment:
      KIS_SERVER__HOST: "0.0.0.0"
      KIS_SERVER__PORT: "8080"
      KIS_DATABASE__PATH: "/data/data/kis.db"
      KIS_SECURITY__AUDIT__LOG_FILE: "/data/logs/audit.log"
      KIS_JWT_SECRET: ${KIS_JWT_SECRET:?Generate KIS_JWT_SECRET in .env}
      KIS_MASTER_KEY: ${KIS_MASTER_KEY:?Generate KIS_MASTER_KEY in .env}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - kis_data:/data/data
      - kis_logs:/data/logs
      - ./config:/data/config:ro
    restart: unless-stopped
volumes:
  kis_data:
  kis_logs:
